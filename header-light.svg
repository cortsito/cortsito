<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="luis cortes - product, data, infrastructure">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1f2328"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1"    stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges">
      <rect x="0" y="0" width="900" height="200" fill="url(#fade)"/>
    </mask>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","SFMono-Regular","SF Mono",ui-monospace,Menlo,Consolas,monospace; }

    .drift  { animation: drift 24s linear infinite; }
    .name   { opacity: 0; animation: settle 1.4s cubic-bezier(.2,.7,.2,1) .1s forwards; }
    .rule   { stroke-dasharray: 420; stroke-dashoffset: 420;
              animation: draw 1.5s cubic-bezier(.3,.8,.2,1) .55s forwards; }
    .triad  { opacity: 0; animation: rise 1.1s cubic-bezier(.2,.7,.2,1) 1.15s forwards; }
    .caret  { opacity: 0; animation: show .01s linear 1.9s forwards, blink 1.25s steps(1) 1.9s infinite; }

    @keyframes drift  { to   { transform: translateX(-24px); } }
    @keyframes settle { from { opacity: 0; letter-spacing: 20px; }
                        to   { opacity: 1; letter-spacing: 7px;  } }
    @keyframes draw   { to   { stroke-dashoffset: 0; } }
    @keyframes rise   { from { opacity: 0; transform: translateY(6px); }
                        to   { opacity: .62; transform: translateY(0); } }
    @keyframes show   { to   { opacity: 1; } }
    @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .drift, .name, .rule, .triad, .caret { animation: none; }
      .name { opacity: 1; letter-spacing: 7px; }
      .rule { stroke-dashoffset: 0; }
      .triad { opacity: .62; }
      .caret { opacity: 1; }
    }
  </style>

  <g mask="url(#edges)" opacity="0.11">
    <g class="drift">
      <rect x="-24" y="0" width="960" height="200" fill="url(#dots)"/>
    </g>
  </g>

  <text class="mono name" x="453.5" y="92" text-anchor="middle"
        font-size="42" font-weight="500" fill="#1f2328" letter-spacing="7">luis cortés</text>

  <line class="rule" x1="240" y1="118" x2="660" y2="118" stroke="#1f2328" stroke-opacity=".28" stroke-width="1"/>

  <text class="mono triad" x="452.75" y="146" text-anchor="middle"
        font-size="12.5" letter-spacing="5.5" fill="#1f2328">product · data · infrastructure</text>

  <rect class="caret" x="446" y="164" width="9" height="15" fill="#1f2328" fill-opacity=".8"/>
</svg>
